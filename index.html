<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una historia para ti</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

:root{
    --gold:#d4af37;
    --gold-light:#f7e8a6;
    --gold-dark:#9d7416;
    --black:#020207;
    --wine:#170a10;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020207;
    color:white;
}

body{
    font-family:'Cinzel',serif;
}

button{
    font-family:inherit;
}

#visual{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            rgba(100,70,20,.15),
            transparent 45%
        ),
        #020207;
}

#visual canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   CAPAS
========================================================= */

.layer{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    background:
        radial-gradient(
            circle at center,
            rgba(80,50,20,.12),
            transparent 45%
        ),
        rgba(2,2,7,.90);

    opacity:0;
    visibility:hidden;
    transform:scale(1.035);

    transition:
        opacity .85s ease,
        transform .95s cubic-bezier(.22,.61,.36,1),
        visibility .85s;
}

.layer.active{
    opacity:1;
    visibility:visible;
    transform:scale(1);
}

.layer.fade-out{
    opacity:0;
    transform:scale(.96);
}

.transparent{
    background:transparent;
    pointer-events:none;
}

/* =========================================================
   FLORES
========================================================= */

.flower{
    position:fixed;
    z-index:500;

    width:clamp(65px,9vw,120px);

    opacity:.72;

    pointer-events:none;

    filter:
        drop-shadow(
            0 0 18px
            rgba(212,175,55,.35)
        );

    animation:
        floatFlower 7s ease-in-out infinite;
}

.flower.one{
    left:12px;
    top:12px;
}

.flower.two{
    right:12px;
    top:12px;

    animation-delay:1.5s;
}

.flower.three{
    left:12px;
    bottom:12px;

    animation-delay:3s;
}

.flower.four{
    right:12px;
    bottom:12px;

    animation-delay:4.5s;
}

@keyframes floatFlower{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-10px)
            rotate(4deg);
    }
}

/* =========================================================
   AUDIO
========================================================= */

#audioButton{

    position:fixed;

    right:20px;
    top:20px;

    z-index:1000;

    width:48px;
    height:48px;

    border-radius:50%;

    border:
        1px solid
        rgba(212,175,55,.55);

    background:
        rgba(4,3,8,.78);

    color:var(--gold-light);

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.3s;

    font-size:17px;
}

#audioButton:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 30px
        rgba(212,175,55,.3);
}

#audioButton.playing{

    box-shadow:
        0 0 0 7px
        rgba(212,175,55,.035),
        0 0 35px
        rgba(212,175,55,.35);

}

/* =========================================================
   CONTADOR
========================================================= */

#counter{

    position:fixed;

    right:27px;
    bottom:22px;

    z-index:900;

    color:
        rgba(255,255,255,.36);

    font-size:9px;

    letter-spacing:3px;
}

/* =========================================================
   INTRO
========================================================= */

.intro{
    width:min(850px,92%);
    text-align:center;
}

.eyebrow{

    color:var(--gold-light);

    font-size:10px;

    letter-spacing:5px;

    text-transform:uppercase;

    margin-bottom:26px;

    opacity:.85;
}

.intro h1{

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:
        clamp(
            55px,
            10vw,
            115px
        );

    line-height:.82;

    font-weight:400;

    letter-spacing:-3px;
}

.intro h1 span{

    display:block;

    color:var(--gold-light);

    font-style:italic;
}

.intro p{

    max-width:590px;

    margin:34px auto 0;

    color:
        rgba(255,255,255,.62);

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:20px;

    line-height:1.7;
}

.gold-button{

    margin-top:38px;

    padding:16px 40px;

    border:
        1px solid
        rgba(212,175,55,.65);

    background:
        linear-gradient(
            135deg,
            #f4dc83,
            #ad7d18
        );

    color:#1c1204;

    font-size:10px;

    letter-spacing:3px;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 0 35px
        rgba(212,175,55,.18);
}

.gold-button:hover{

    transform:
        translateY(-4px);

    box-shadow:
        0 0 55px
        rgba(212,175,55,.4);
}

/* =========================================================
   SOBRE
========================================================= */

.envelope-area{
    text-align:center;
}

.envelope{

    position:relative;

    width:
        min(
            430px,
            82vw
        );

    height:270px;

    margin:auto;

    cursor:pointer;

    perspective:900px;
}

.envelope-body{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            145deg,
            #49242b,
            #15090d
        );

    border:
        1px solid
        rgba(212,175,55,.45);

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.7);
}

.envelope-flap{

    position:absolute;

    z-index:4;

    left:0;
    top:0;

    width:100%;
    height:155px;

    background:
        linear-gradient(
            135deg,
            #64313a,
            #211014
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:top;

    transition:
        transform
        1.1s
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        );
}

.envelope.open .envelope-flap{
    transform:
        rotateX(180deg);
}

.seal{

    position:absolute;

    z-index:6;

    left:50%;
    top:50%;

    width:68px;
    height:68px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #f8e6a0,
            #a87513
        );

    color:#2c1a04;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:25px;

    transition:.7s;
}

.envelope.open .seal{

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(1.5);
}

.envelope-word{

    position:absolute;

    z-index:5;

    left:0;
    right:0;

    bottom:31px;

    color:#f3dfab;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:22px;

    font-style:italic;
}

/* =========================================================
   GALAXIA
========================================================= */

.galaxy-title{

    position:absolute;

    top:11%;

    width:100%;

    text-align:center;

    z-index:20;
}

.galaxy-title h2{

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:
        clamp(
            42px,
            7vw,
            78px
        );

    font-weight:400;
}

.galaxy-title h2 span{

    color:var(--gold-light);

    font-style:italic;
}

.galaxy-title small{

    display:block;

    margin-top:13px;

    color:
        rgba(255,255,255,.4);

    font-size:9px;

    letter-spacing:4px;

    text-transform:uppercase;
}

/* =========================================================
   FOTOS
========================================================= */

.photo-layer{

    background:
        rgba(2,2,7,.76);
}

.photo-bg{

    position:absolute;

    inset:-6%;

    background-size:cover;

    background-position:center;

    filter:
        blur(25px)
        brightness(.27);

    transform:scale(1.08);

    opacity:.62;
}

.photo-bg::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.85),
            transparent 45%,
            rgba(0,0,0,.85)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.75),
            transparent 45%,
            rgba(0,0,0,.65)
        );
}

.photo-number{

    position:absolute;

    top:28px;
    left:28px;

    z-index:20;

    color:
        rgba(255,255,255,.45);

    font-size:9px;

    letter-spacing:4px;
}

.photo-card{

    position:relative;

    z-index:20;

    width:
        min(
            390px,
            77vw
        );

    height:
        min(
            540px,
            70vh
        );

    padding:
        10px
        10px
        57px;

    background:#eee7d8;

    box-shadow:
        0 45px 100px
        rgba(0,0,0,.82);

    cursor:pointer;

    transform:
        rotate(-2deg);

    transition:.6s;
}

.photo-card:hover{

    transform:
        rotate(0deg)
        scale(1.025);
}

.photo-card img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.photo-caption{

    position:absolute;

    left:10px;
    right:10px;
    bottom:13px;

    color:#201817;

    text-align:center;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:18px;

    font-style:italic;
}

.photo-hint{

    position:absolute;

    bottom:23px;

    width:100%;

    text-align:center;

    color:
        rgba(255,255,255,.4);

    font-size:9px;

    letter-spacing:3px;

    text-transform:uppercase;
}

/* =========================================================
   MENSAJES
========================================================= */

.message{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    background:
        rgba(3,2,7,.9);

    backdrop-filter:blur(16px);

    opacity:0;

    visibility:hidden;

    transition:.65s;
}

.message.show{

    opacity:1;

    visibility:visible;
}

.message-box{

    width:
        min(
            620px,
            90%
        );

    padding:
        55px 40px;

    text-align:center;

    border:
        1px solid
        rgba(212,175,55,.3);

    background:
        linear-gradient(
            145deg,
            rgba(43,20,26,.9),
            rgba(8,5,9,.94)
        );

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.7);
}

.message-box small{

    color:var(--gold);

    font-size:9px;

    letter-spacing:4px;

    text-transform:uppercase;
}

.message-box h2{

    margin:
        20px
        0
        22px;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:
        clamp(
            40px,
            6vw,
            67px
        );

    font-weight:400;

    color:#f7e9c6;
}

.message-box p{

    font-family:
        'Cormorant Garamond',
        serif;

    color:
        rgba(255,255,255,.7);

    font-size:20px;

    line-height:1.8;
}

/* =========================================================
   CARTAS
========================================================= */

.letter{

    width:
        min(
            720px,
            90%
        );

    padding:
        60px 50px;

    text-align:center;

    border:
        1px solid
        rgba(212,175,55,.27);

    background:
        linear-gradient(
            145deg,
            rgba(43,20,26,.76),
            rgba(7,4,8,.88)
        );

    box-shadow:
        0 45px 100px
        rgba(0,0,0,.68);
}

.line{

    width:50px;
    height:1px;

    background:var(--gold);

    margin:
        0
        auto
        28px;
}

.letter h2{

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:
        clamp(
            42px,
            7vw,
            72px
        );

    font-weight:400;

    color:#f4e5c1;

    margin-bottom:25px;
}

.letter p{

    max-width:580px;

    margin:auto;

    font-family:
        'Cormorant Garamond',
        serif;

    font-size:20px;

    line-height:1.9;

    color:
        rgba(255,255,255,.7);
}

/* =========================================================
   FINAL
========================================================= */

.final{

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #020207,
            #170a10
        );
}

.final-content{

    width:min(900px,92%);

    text-align:center;
}

.final-small{

    color:var(--gold-light);

    font-size:10px;

    letter-spacing:5px;

    text-transform:uppercase;

    margin-bottom:27px;
}
